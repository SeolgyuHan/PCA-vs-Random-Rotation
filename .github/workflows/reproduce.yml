name: reproduce
on: [push, pull_request]
jobs:
  results-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy==2.2.*" "matplotlib==3.10.*"
      - run: bash reproduce.sh
